<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win 1M$ - The Untouchable Button 🎯</title>
    <!-- Bootstrap 5.3 CSS corect încărcat -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Animate.css pentru efecte speciale -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<!-- Bootstrap d-flex forțează centrarea pe tot ecranul -->
<body class="d-flex justify-content-center align-items-center vh-100 overflow-hidden text-white text-center m-0">

    <div class="container d-flex flex-column justify-content-center align-items-center position-relative h-100 w-100">
        
        <!-- Alertă Bootstrap de succes -->
        <div id="success-alert" class="alert alert-success d-none shadow-lg border-3 border-success p-4 rounded-4 animate__animated animate__fadeInDown" style="max-width: 500px; z-index: 10;">
            <h4 class="alert-heading fw-bold">🎉 IMPOSSIBLE! 🎉</h4>
            <p class="mb-0 fs-5">You actually caught it! Claim your prize:</p>
            <h2 class="fw-black my-3 text-success">💰 1,000,000 $ 💰</h2>
            <button class="btn btn-success fw-bold px-4 rounded-pill" onclick="reseteazaJocul()">Play Again 🔄</button>
        </div>

        <!-- Zonă UI centrată nativ prin Bootstrap -->
        <div id="game-ui" class="d-flex flex-column align-items-center justify-content-center mb-5 animate__animated animate__fadeIn">
            <h1 id="title" class="display-3 fw-bold mb-3 custom-title">Win 1,000,000 $! 🚀</h1>
            <p class="fs-4 custom-counter px-4 py-2 rounded-pill shadow-lg border border-secondary bg-dark bg-opacity-70">
                Missed attempts: <span id="score" class="badge bg-warning text-dark fs-5 ms-2">0</span>
            </p>
        </div>

        <!-- Butonul enervant - Stilizat 100% cu clase Bootstrap standard -->
        <button id="crazy-btn" class="btn btn-info btn-lg shadow-lg fw-bold rounded-pill px-5 py-3 border-3 border-white position-absolute">
            Click for 1M$! 🎯
        </button>
        
    </div>

    <!-- Script Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="utils.js"></script>
    <script src="script.js"></script>
</body>
</html>
